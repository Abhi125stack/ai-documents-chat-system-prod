name: CI

# Quality gate: lint + type-check must pass. Vercel's Git integration still owns
# the actual deploy (and runs the full `next build`) on push to main; this
# workflow only blocks broken code from merging. It deliberately does NOT run
# `next build`, because that needs runtime env vars (MONGODB_URI, etc.) which we
# do not want to duplicate as GitHub secrets — Vercel already has them.
#
# Enforce via a branch protection rule on `main` requiring the "Lint & Type Check" check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check
